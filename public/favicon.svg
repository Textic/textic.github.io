<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0815" />
      <stop offset="100%" stop-color="#080205" />
    </linearGradient>
    <linearGradient id="redNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Badge Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#ff1e42" stroke-width="4.5" stroke-opacity="0.85" />
  
  <!-- Corner Circuit Accents -->
  <path d="M 4 28 L 28 4 M 100 4 L 124 28 M 124 100 L 100 124 M 28 124 L 4 100" stroke="#ff1e42" stroke-width="2" stroke-opacity="0.4" />

  <g filter="url(#neonGlow)">
    <!-- Central TexTools T Monogram (Bold & Centered) -->
    <path d="M 30 36 L 98 36 L 98 54 L 73 54 L 73 94 L 55 94 L 55 54 L 30 54 Z" fill="url(#redNeon)" />

    <!-- Core Energy Diode -->
    <circle cx="64" cy="45" r="3.5" fill="#ffffff" />
  </g>
</svg>
