<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#360c1a" />
      <stop offset="100%" stop-color="#0c050a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#ff1e42" stroke-width="8" stroke-opacity="0.6" />
  <g filter="url(#glow)">
    <!-- Cyber T Symbol -->
    <path d="M 120 144 L 392 144 L 392 204 L 294 204 L 294 390 L 218 390 L 218 204 L 120 204 Z" fill="#ff1e42" />
    <!-- Center Dot & Cyber accents -->
    <circle cx="256" cy="390" r="12" fill="#ffffff" />
    <path d="M 104 112 L 152 112" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M 360 112 L 408 112" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
