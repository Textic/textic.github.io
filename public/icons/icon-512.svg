<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#360c1a" />
      <stop offset="100%" stop-color="#0c050a" />
    </linearGradient>
    <linearGradient id="redNeon512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <filter id="neonGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Badge Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad512)" stroke="#ff1e42" stroke-width="12" stroke-opacity="0.85" />
  
  <!-- Corner Circuit Accents -->
  <path d="M 16 100 L 100 16 M 412 16 L 496 100 M 496 412 L 412 496 M 100 496 L 16 412" stroke="#ff1e42" stroke-width="8" stroke-opacity="0.35" />

  <g filter="url(#neonGlow512)">
    <!-- Central TexTools T Monogram (Bold & Centered) -->
    <path d="M 120 144 L 392 144 L 392 216 L 292 216 L 292 376 L 220 376 L 220 216 L 120 216 Z" fill="url(#redNeon512)" />

    <!-- Core Energy Diode -->
    <circle cx="256" cy="180" r="14" fill="#ffffff" />
  </g>
</svg>
